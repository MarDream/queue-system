server:
  port: 8080
  servlet:
    context-path: /
  uri-encoding: UTF-8
  tomcat:
    uri-encoding: UTF-8

spring:
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write_dates_as_timestamps: false
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

app:
  version: ${APP_VERSION:}
  ip:                  # 部署时手动指定，留空则自动获取本机IP
  frontend:
    port: 5173
    base-url:
  cors:
    extra-origins:     # 额外的 CORS 允许源，逗号分隔
  phone-encryption:
    master-key:        # 建议部署时通过环境变量覆盖，未配置时回退到 jwt.secret
    key-version: 1

logging:
  file:
    path: ./logs
  level:
    root: INFO
    com.queue: INFO
