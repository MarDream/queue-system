# 公网云独立部署模式（仅 backend）
# 适用于 MySQL、Redis、Nginx 已经在云服务器上单独运行的场景
# 在云服务器上优先执行：./build-and-up.sh [tag]

services:
  backend:
    image: queue-backend:${IMAGE_TAG:-latest}
    build:
      context: ../queue-system-backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: queue-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-queue_system}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-at-least-32-chars!}
      APP_PUBLIC_HOST: ${APP_PUBLIC_HOST:-43.155.249.87}
      APP_FRONTEND_PORT: ${APP_FRONTEND_PORT:-80}
      APP_CORS_EXTRA_ORIGINS: ${APP_CORS_EXTRA_ORIGINS:-}
      LOG_PATH: ${LOG_PATH:-/app/logs}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/config/application-prod.yml:/app/config/application-prod.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - queue-net

networks:
  queue-net:
    name: ${BACKEND_NETWORK_NAME:-queue-shared}
    driver: bridge
