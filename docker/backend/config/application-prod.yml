server:
  port: 8080
  servlet:
    context-path: /
  uri-encoding: UTF-8
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/${DB_NAME:queue_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useUnicode=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
          socketFactory:
            class: ${MAIL_SMTP_SOCKET_FACTORY_CLASS:javax.net.ssl.SSLSocketFactory}
            port: ${MAIL_SMTP_SOCKET_FACTORY_PORT:465}

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

queue:
  config:
    avg-service-minutes: 3
    ticket-number-padding: 3

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars!}
  expiration: 86400000

app:
  ip: ${APP_PUBLIC_HOST:43.155.249.87}
  frontend:
    port: ${APP_FRONTEND_PORT:80}
    base-url: ${APP_FRONTEND_BASE_URL:}
  cors:
    extra-origins: ${APP_CORS_EXTRA_ORIGINS:}

logging:
  file:
    path: ${LOG_PATH:/app/logs}
  level:
    root: INFO
    com.queue: INFO
